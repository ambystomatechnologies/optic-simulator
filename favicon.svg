<svg viewBox="0 0 48 48" width="48" height="48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="48" height="48" rx="12" fill="#0b0f19"/>
  <defs>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <!-- Lente biconvexa óptica central -->
  <path d="M24 6 C32 16 32 32 24 42 C16 32 16 16 24 6 Z" fill="url(#lensGrad)" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2.2" stroke-linejoin="round"/>
  <line x1="24" y1="9" x2="24" y2="39" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="2 2"/>
  <!-- Rayos luminosos -->
  <path d="M4 15 L20 15 L40 24" stroke="url(#beamGrad)" stroke-width="2" stroke-linecap="round"/>
  <path d="M2 24 L42 24" stroke="#a5f3fc" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M4 33 L20 33 L40 24" stroke="url(#beamGrad)" stroke-width="2" stroke-linecap="round"/>
  <!-- Foco luminoso -->
  <circle cx="40" cy="24" r="5" fill="#38bdf8" fill-opacity="0.4"/>
  <circle cx="40" cy="24" r="2.2" fill="#ffffff"/>
</svg>